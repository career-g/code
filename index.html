<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大学入試 5桁コード逆引きツール</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 1rem;
            margin: 0;
            color: var(--primary-color);
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        button.danger { background-color: #dc2626; }
        button.danger:hover { background-color: #b91c1c; }
        
        /* 検索カード */
        .search-card {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            margin-bottom: 12px;
        }
        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            margin-bottom: 8px;
        }
        .search-field label {
            display: block;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 3px;
            color: #64748b;
        }
        .search-field input {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            box-sizing: border-box;
            background: #f8fafc;
        }
        .search-field input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .search-info {
            font-size: 0.75rem;
            color: #64748b;
            text-align: right;
        }

        /* テーブル・コンテナ */
        .table-container {
            background: transparent;
            margin-bottom: 16px;
            max-height: 500px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            font-size: 0.85rem;
        }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
            text-align: left;
        }
        th {
            background: #f8fafc;
            color: #475569;
            font-weight: 600;
        }
        .code-cell-pc {
            font-family: monospace;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        /* 保存リストエリア */
        .clip-section {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            border: 2px dashed var(--primary-color);
            margin-bottom: 20px;
        }
        .clip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .clip-title {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--primary-color);
        }
        .clip-count {
            background: #dbeafe;
            color: #1e40af;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        #status-msg {
            text-align: center;
            padding: 24px;
            color: #64748b;
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* 日程方式別の背景色クラス（見やすさ重視のアレンジ） */
        .bg-zenki { background-color: #eff6ff !important; border-color: #bfdbfe !important; } /* 薄い青 */
        .bg-chuki { background-color: #fefce8 !important; border-color: #fef08a !important; } /* 薄い黄色 */
        .bg-koki  { background-color: #fef2f2 !important; border-color: #fecaca !important; } /* 薄い赤 */

        /* ==========================================
           スマホ用カードレイアウト（左側にコード配置）
           ========================================== */
        @media screen and (max-width: 768px) {
            table, thead, tbody, th, tr {
                display: none;
            }
            .table-container {
                display: flex;
                flex-direction: column;
                gap: 8px;
                max-height: none;
            }
            .mobile-card {
                border: 1px solid var(--border-color);
                border-radius: 10px;
                padding: 10px 12px;
                box-shadow: 0 1px 2px rgba(0,0,0,0.04);
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
            }
            /* 左側のコードエリア */
            .card-code-area {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-width: 75px;
                padding-right: 8px;
                border-right: 1px solid rgba(0,0,0,0.08);
            }
            .card-code {
                font-family: monospace;
                font-size: 1.2rem;
                font-weight: bold;
                color: #1d4ed8;
                margin-bottom: 2px;
            }
            /* 右側の情報エリア */
            .mobile-card-content {
                flex-grow: 1;
            }
            .card-univ {
                font-size: 0.95rem;
                font-weight: bold;
                color: #0f172a;
                margin-bottom: 1px;
            }
            .card-dept {
                font-size: 0.8rem;
                color: #475569;
                margin-bottom: 3px;
            }
            .card-meta {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                align-items: center;
            }
            .card-badge {
                background: rgba(255, 255, 255, 0.7);
                border: 1px solid rgba(0,0,0,0.08);
                color: #334155;
                font-size: 0.7rem;
                padding: 1px 6px;
                border-radius: 4px;
                font-weight: 600;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>大学入試 5桁コード逆引き</h1>
        <div style="font-size: 0.75rem; color: #64748b;">コード左側・色分け版</div>
    </header>

    <!-- 検索エリア（5項目） -->
    <div class="search-card">
        <div class="search-grid">
            <div class="search-field">
                <label>大学名</label>
                <input type="text" id="s-univ" placeholder="例: 名古屋" oninput="filterData()">
            </div>
            <div class="search-field">
                <label>学部名</label>
                <input type="text" id="s-fac" placeholder="例: 理" oninput="filterData()">
            </div>
            <div class="search-field">
                <label>学科名</label>
                <input type="text" id="s-dept" placeholder="例: 物理" oninput="filterData()">
            </div>
            <div class="search-field">
                <label>方式</label>
                <input type="text" id="s-method" placeholder="例: 前期" oninput="filterData()">
            </div>
            <div class="search-field">
                <label>日程</label>
                <input type="text" id="s-schedule" placeholder="例: Ⅰ期" oninput="filterData()">
            </div>
        </div>
        <div class="search-info" id="match-count">データを読み込んでいます...</div>
    </div>

    <!-- 検索結果一覧 -->
    <div id="status-msg">GitHubから「code.csv」を読み込んでいます...</div>
    <div class="table-container" id="result-container">
        <table id="result-table">
            <thead>
                <tr>
                    <th>5桁コード</th>
                    <th>大学名・学部・学科名</th>
                    <th>方式・日程</th>
                    <th style="text-align: center;">操作</th>
                </tr>
            </thead>
            <tbody id="result-body"></tbody>
        </table>
    </div>

    <!-- クリップボード（最大10件記憶・スクショ用） -->
    <div class="clip-section">
        <div class="clip-header">
            <div class="clip-title">📋 転記用リスト（スクショ用・最大10件）</div>
            <div class="clip-count" id="clip-count">0 / 10件</div>
        </div>
        <div class="table-container" style="max-height: 200px; margin-bottom: 0;">
            <table id="clip-table">
                <thead>
                    <tr>
                        <th>5桁コード</th>
                        <th>大学名・学部・学科名</th>
                        <th>方式・日程</th>
                        <th style="text-align: center;">操作</th>
                    </tr>
                </thead>
                <tbody id="clip-body">
                    <tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 15px;">ここに保存した項目が並びます</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let allData = [];
    let savedList = [];

    window.addEventListener("DOMContentLoaded", () => {
        loadGitHubCSV();
    });

    async function loadGitHubCSV() {
        try {
            const response = await fetch('./code.csv', { cache: 'no-store' });
            if (!response.ok) throw new Error("「code.csv」が見つかりませんでした。");
            const text = await response.text();
            parseCSV(text);
        } catch (err) {
            document.getElementById("status-msg").innerText = "エラー: " + err.message + " (GitHub上のファイル配置をご確認ください)";
            document.getElementById("match-count").innerText = "読み込み失敗";
        }
    }

    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        if (lines.length < 2) throw new Error("CSVデータが空か不正です");
        const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
        
        const colMap = {};
        headers.forEach((h, idx) => { colMap[h] = idx; });

        const codeKey = Object.keys(colMap).find(k => k.includes('5桁コード') || k.includes('記入用大学コード'));
        const univKey = Object.keys(colMap).find(k => k === '大学名');
        const facKey = Object.keys(colMap).find(k => k === '学部名');
        const deptKey = Object.keys(colMap).find(k => k === '学科名');
        const methodKey = Object.keys(colMap).find(k => k.includes('日程方式名') || k.includes('方式名'));
        const schedKey = Object.keys(colMap).find(k => k.includes('日程方式') || k.includes('回') || k.includes('日程'));

        const parsed = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const row = parseCSVLine(lines[i]);
            if (row.length < headers.length) continue;

            const code = codeKey !== undefined ? row[colMap[codeKey]] : '';
            const univ = univKey !== undefined ? row[colMap[univKey]] : '';
            const fac = facKey !== undefined ? row[colMap[facKey]] : '';
            const dept = deptKey !== undefined ? row[colMap[deptKey]] : '';
            const method = methodKey !== undefined ? row[colMap[methodKey]] : '';
            const sched = schedKey !== undefined ? row[colMap[schedKey]] : '';

            if (code && code !== 'NaN') {
                parsed.push({
                    code: String(code).replace(/\.0$/, '').padStart(5, '0'),
                    univ: univ && univ !== 'nan' ? univ : '',
                    fac: fac && fac !== 'nan' ? fac : '',
                    dept: dept && dept !== 'nan' && dept !== 'NaN' ? dept : '',
                    method: method && method !== 'nan' ? method : '',
                    sched: sched && sched !== 'nan' ? sched : ''
                });
            }
        }

        allData = parsed;
        document.getElementById("status-msg").style.display = "none";
        filterData();
    }

    function parseCSVLine(text) {
        let result = [], cur = '', inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            if (c === '"') { inQuotes = !inQuotes; }
            else if (c === ',' && !inQuotes) { result.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
            else { cur += c; }
        }
        result.push(cur.trim().replace(/^"|"$/g, ''));
        return result;
    }

    // 方式名から背景色クラスを判定する関数
    function getBgClass(methodText) {
        if (!methodText) return "";
        const m = methodText.toLowerCase();
        if (m.includes('前期')) return "bg-zenki";
        if (m.includes('中期')) return "bg-chuki";
        if (m.includes('後期')) return "bg-koki";
        return "";
    }

    function filterData() {
        if (allData.length === 0) return;

        const qUniv = document.getElementById("s-univ").value.trim().toLowerCase();
        const qFac = document.getElementById("s-fac").value.trim().toLowerCase();
        const qDept = document.getElementById("s-dept").value.trim().toLowerCase();
        const qMethod = document.getElementById("s-method").value.trim().toLowerCase();
        const qSched = document.getElementById("s-schedule").value.trim().toLowerCase();

        const filtered = allData.filter(item => {
            if (qUniv && !item.univ.toLowerCase().startsWith(qUniv)) return false;
            if (qFac && !item.fac.toLowerCase().startsWith(qFac)) return false;
            if (qDept && !item.dept.toLowerCase().startsWith(qDept)) return false;
            if (qMethod && !item.method.toLowerCase().startsWith(qMethod)) return false;
            if (qSched && !item.sched.toLowerCase().startsWith(qSched)) return false;
            return true;
        });

        renderResults(filtered);
    }

    function renderResults(list) {
        const tbody = document.getElementById("result-body");
        const container = document.getElementById("result-container");
        const countDiv = document.getElementById("match-count");
        countDiv.innerText = `該当件数: ${list.length.toLocaleString()} 件`;

        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 20px;">条件に一致するデータが見つかりません</td></tr>`;
            container.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 20px; background: white; border-radius: 10px;">条件に一致するデータが見つかりません</div>`;
            return;
        }

        const displayList = list.slice(0, 100);
        
        // PC用テーブルのHTML
        let pcHtml = "";
        displayList.forEach(item => {
            const bgClass = getBgClass(item.method);
            const schedStr = `${item.method} ${item.sched ? '(' + item.sched + ')' : ''}`;
            pcHtml += `
                <tr class="${bgClass}">
                    <td class="code-cell-pc">${item.code}</td>
                    <td><strong>${item.univ}</strong> ${item.fac} ${item.dept ? ' / ' + item.dept : ''}</td>
                    <td><span class="card-badge">${schedStr}</span></td>
                    <td style="text-align: center;"><button onclick='addToList(${JSON.stringify(item)})'>保存</button></td>
                </tr>
            `;
        });

        // スマホ用カードのHTML（左側にコード、色分け背景）
        let mobileHtml = "";
        displayList.forEach(item => {
            const bgClass = getBgClass(item.method);
            const deptStr = item.dept ? item.dept : '';
            const schedStr = `${item.method} ${item.sched ? '(' + item.sched + ')' : ''}`;
            mobileHtml += `
                <div class="mobile-card ${bgClass}">
                    <div class="card-code-area">
                        <div class="card-code">${item.code}</div>
                        <button onclick='addToList(${JSON.stringify(item)})'>保存</button>
                    </div>
                    <div class="mobile-card-content">
                        <div class="card-univ">${item.univ} ${item.fac}</div>
                        ${deptStr ? `<div class="card-dept">${deptStr}</div>` : ''}
                        <div class="card-meta">
                            <span class="card-badge">${schedStr}</span>
                        </div>
                    </div>
                </div>
            `;
        });

        let wrapperHtml = `
            <table id="result-table">
                <thead>
                    <tr>
                        <th>5桁コード</th>
                        <th>大学名・学部・学科名</th>
                        <th>方式・日程</th>
                        <th style="text-align: center;">操作</th>
                    </tr>
                </thead>
                <tbody>${pcHtml}</tbody>
            </table>
            <div class="mobile-cards-wrapper" style="display:none; flex-direction:column; gap:8px;">
                ${mobileHtml}
            </div>
        `;
        
        container.innerHTML = wrapperHtml;
        
        const styleTag = document.getElementById("dynamic-style") || document.createElement('style');
        styleTag.id = "dynamic-style";
        styleTag.innerHTML = `
            @media screen and (max-width: 768px) {
                #result-table { display: none !important; }
                .mobile-cards-wrapper { display: flex !important; }
            }
        `;
        document.head.appendChild(styleTag);

        if (list.length > 100) {
            countDiv.innerText += ` (最初の100件を表示)`;
        }
    }

    function addToList(item) {
        if (savedList.some(i => i.code === item.code && i.univ === item.univ && i.method === item.method)) {
            alert("この項目はすでにリストに登録されています。");
            return;
        }
        if (savedList.length >= 10) {
            alert("保存リストは最大10件までです。不要な項目を削除してから追加してください。");
            return;
        }
        savedList.push(item);
        renderSavedList();
    }

    function removeFromList(index) {
        savedList.splice(index, 1);
        renderSavedList();
    }

    function renderSavedList() {
        const tbody = document.getElementById("clip-body");
        document.getElementById("clip-count").innerText = `${savedList.length} / 10件`;

        if (savedList.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 15px;">ここに保存した項目が並びます</td></tr>`;
            return;
        }

        let html = "";
        savedList.forEach((item, idx) => {
            const bgClass = getBgClass(item.method);
            const schedStr = `${item.method} ${item.sched ? '(' + item.sched + ')' : ''}`;
            html += `
                <tr class="${bgClass}">
                    <td class="code-cell-pc">${item.code}</td>
                    <td><strong>${item.univ}</strong> ${item.fac} ${item.dept ? ' / ' + item.dept : ''}</td>
                    <td><span class="card-badge">${schedStr}</span></td>
                    <td style="text-align: center;"><button class="danger" onclick="removeFromList(${idx})">削除</button></td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }
</script>

</body>
</html>
