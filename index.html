<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大学入試 5桁コード逆引きツール</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 8px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            background: var(--card-bg);
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 0.95rem;
            margin: 0;
            color: var(--primary-color);
        }
        .header-sub {
            font-size: 0.75rem;
            color: #64748b;
            font-weight: bold;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        button.danger { background-color: #dc2626; }
        button.danger:hover { background-color: #b91c1c; }
        
        /* 検索カード */
        .search-card {
            background: var(--card-bg);
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            margin-bottom: 8px;
        }
        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 6px;
            margin-bottom: 6px;
        }
        .search-field label {
            display: block;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 2px;
            color: #64748b;
        }
        .search-field input, .search-field select {
            width: 100%;
            padding: 5px 8px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 0.8rem;
            box-sizing: border-box;
            background: #f8fafc;
        }
        .search-field input:focus, .search-field select:focus {
            outline: none;
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        /* 目立つ件数表示エリア */
        .search-info-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }
        .highlight-count {
            color: #2563eb;
            font-size: 1rem;
        }
        .highlight-count.error {
            color: #dc2626;
        }

        /* 大学別アコーディオン・グループ */
        .univ-group {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 6px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .univ-header {
            padding: 10px 12px;
            background: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            color: #0f172a;
            user-select: none;
            transition: background 0.2s;
        }
        .univ-header:hover {
            background: #f1f5f9;
        }
        .univ-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .univ-count-badge {
            background: #e2e8f0;
            color: #475569;
            font-size: 0.7rem;
            padding: 1px 6px;
            border-radius: 10px;
            font-weight: normal;
        }
        .univ-arrow {
            font-size: 0.8rem;
            color: #64748b;
            transition: transform 0.2s;
        }
        .univ-group.open .univ-arrow {
            transform: rotate(180deg);
        }
        
        .univ-content {
            display: none;
            padding: 8px;
            background: #ffffff;
            border-top: 1px solid #f1f5f9;
            flex-direction: column;
            gap: 8px;
        }
        .univ-group.open .univ-content {
            display: flex;
        }

        /* 学部ごとのまとまり */
        .fac-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 6px 8px;
        }
        .fac-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: #334155;
            margin-bottom: 4px;
            padding-bottom: 2px;
            border-bottom: 1px dashed #cbd5e1;
        }
        .fac-cards-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .table-container {
            background: transparent;
            margin-bottom: 12px;
            max-height: 500px;
            overflow-y: auto;
        }
        .clip-table-container {
            max-height: 250px;
            margin-bottom: 0;
        }

        /* 保存リストエリア */
        .clip-section {
            background: var(--card-bg);
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            border: 2px dashed var(--primary-color);
            margin-bottom: 16px;
        }
        .clip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .clip-title {
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--primary-color);
        }
        .clip-count {
            background: #dbeafe;
            color: #1e40af;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        #status-msg, .guide-msg {
            text-align: center;
            padding: 20px;
            color: #475569;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            font-size: 0.85rem;
            font-weight: 500;
        }
        .guide-msg.error {
            color: #dc2626;
        }
        .guide-msg.small {
            padding: 10px;
            font-size: 0.8rem;
        }

        /* 国公立の日程別背景色 */
        .bg-zenki  { background-color: #eff6ff !important; border-color: #bfdbfe !important; }
        .bg-chuki  { background-color: #fefce8 !important; border-color: #fef08a !important; }
        .bg-koki   { background-color: #fef2f2 !important; border-color: #fecaca !important; }
        .bg-dokuji { background-color: #f3e8ff !important; border-color: #d8b4fe !important; }

        /* 個別カードレイアウト */
        .sub-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 5px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }
        .sub-card-code-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            padding-right: 6px;
            border-right: 1px solid rgba(0,0,0,0.08);
        }
        .sub-card-code {
            font-family: monospace;
            font-size: 1.05rem;
            font-weight: bold;
            color: #1d4ed8;
            margin-bottom: 1px;
        }
        .sub-card-content {
            flex-grow: 1;
        }
        .sub-card-main {
            font-size: 0.8rem;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 1px;
        }
        .sub-card-badge {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(0,0,0,0.08);
            color: #334155;
            font-size: 0.65rem;
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: 600;
        }

        /* トースト通知 */
        #toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background-color: rgba(15, 23, 42, 0.92);
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            text-align: center;
            backdrop-filter: blur(4px);
            max-width: 85vw;
            line-height: 1.5;
            word-break: auto-phrase;
        }
        #toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        #toast.error {
            background-color: rgba(220, 38, 38, 0.95);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>大学入試 5桁コード逆引き</h1>
        <div class="header-sub" id="header-year-sub">読み込み中...</div>
    </header>

    <!-- 検索エリア -->
    <div class="search-card">
        <div class="search-grid">
            <div class="search-field">
                <label>学校区分</label>
                <select id="s-type" onchange="filterData()">
                    <option value="">すべて</option>
                    <option value="1">国立</option>
                    <option value="2">公立</option>
                    <option value="3">私立</option>
                    <option value="4">国公立短大</option>
                    <option value="5">私立短大</option>
                    <option value="6">大学校</option>
                    <option value="8">専門</option>
                </select>
            </div>
            <div class="search-field">
                <label>大学名</label>
                <input type="text" id="s-univ" placeholder="例: 名古屋" oninput="filterData()">
            </div>
            <div class="search-field">
                <label>学部名</label>
                <input type="text" id="s-fac" placeholder="例: 理" oninput="filterData()">
            </div>
            <div class="search-field">
                <label>学科名</label>
                <input type="text" id="s-dept" placeholder="例: 物理" oninput="filterData()">
            </div>
            <div class="search-field">
                <label>日程方式名</label>
                <input type="text" id="s-method" placeholder="例: 前期" oninput="filterData()">
            </div>
        </div>
        <div class="search-info-box" id="match-count-box">
            <span>データ読み込み中...</span>
        </div>
    </div>

    <!-- 検索結果一覧 -->
    <div id="status-msg">GitHubから「code.csv」を読み込んでいます...</div>
    <div class="table-container" id="result-container"></div>

    <!-- 転記用リスト -->
    <div class="clip-section">
        <div class="clip-header">
            <div class="clip-title">📋 転記用リスト（スクショ用・最大10件）</div>
            <div class="clip-count" id="clip-count">0 / 10件</div>
        </div>
        <div class="table-container clip-table-container" id="clip-container">
            <div class="guide-msg small" id="clip-empty-msg">ここに保存した項目が並びます</div>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    let allData = [];
    let savedList = [];

    window.addEventListener("DOMContentLoaded", () => {
        loadGitHubCSV();
    });

    function showToast(message, isError = false) {
        const toast = document.getElementById("toast");
        toast.innerText = message;
        toast.className = "show" + (isError ? " error" : "");
        if (window.toastTimer) clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => { toast.className = ""; }, 2000);
    }

    async function loadGitHubCSV() {
        try {
            const response = await fetch('./code.csv', { cache: 'no-store' });
            if (!response.ok) throw new Error("「code.csv」が見つかりませんでした。");
            const text = await response.text();
            parseCSV(text);
        } catch (err) {
            document.getElementById("status-msg").innerText = "エラー: " + err.message;
            document.getElementById("match-count-box").innerText = "読み込み失敗";
            document.getElementById("header-year-sub").innerText = "読み込みエラー";
        }
    }

    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        if (lines.length < 2) throw new Error("CSVデータが空か不正です");
        const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
        
        const colMap = {};
        headers.forEach((h, idx) => { colMap[h] = idx; });

        const yearKey = headers[0];
        const codeKey = Object.keys(colMap).find(k => k.includes('5桁コード') || k.includes('記入用大学コード'));
        const univKey = Object.keys(colMap).find(k => k === '大学名');
        const facKey = Object.keys(colMap).find(k => k === '学部名');
        const deptKey = Object.keys(colMap).find(k => k === '学科名');
        const methodNameKey = Object.keys(colMap).find(k => k === '日程方式名');
        const typeKey = Object.keys(colMap).find(k => k.includes('学校区分') || k.includes('設置区分') || k === '区分');

        let detectedYear = '';
        const parsed = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const row = parseCSVLine(lines[i]);
            if (row.length < headers.length) continue;

            if (!detectedYear && yearKey !== undefined) {
                detectedYear = String(row[colMap[yearKey]]).trim().replace(/\.0$/, '');
            }

            const code = codeKey !== undefined ? row[colMap[codeKey]] : '';
            const univ = univKey !== undefined ? row[colMap[univKey]] : '';
            const fac = facKey !== undefined ? row[colMap[facKey]] : '';
            const dept = deptKey !== undefined ? row[colMap[deptKey]] : '';
            const methodName = methodNameKey !== undefined ? row[colMap[methodNameKey]] : '';
            const typeVal = typeKey !== undefined ? String(row[colMap[typeKey]]).trim() : '';

            if (code && code !== 'NaN') {
                parsed.push({
                    code: String(code).replace(/\.0$/, '').padStart(5, '0'),
                    univ: univ && univ !== 'nan' ? univ : '',
                    fac: fac && fac !== 'nan' ? fac : '学部なし',
                    dept: dept && dept !== 'nan' && dept !== 'NaN' ? dept : '',
                    methodName: methodName && methodName !== 'nan' ? methodName : '',
                    schoolType: typeVal
                });
            }
        }

        if (detectedYear) {
            const numYear = parseInt(detectedYear, 10);
            if (!isNaN(numYear)) {
                document.getElementById("header-year-sub").innerText = `${numYear}年度実施 (${numYear + 1}年度入試用)`;
            } else {
                document.getElementById("header-year-sub").innerText = `${detectedYear}年度実施`;
            }
        } else {
            document.getElementById("header-year-sub").innerText = "";
        }

        allData = parsed;
        document.getElementById("status-msg").style.display = "none";
        filterData();
    }

    function parseCSVLine(text) {
        let result = [], cur = '', inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            if (c === '"') { inQuotes = !inQuotes; }
            else if (c === ',' && !inQuotes) { result.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
            else { cur += c; }
        }
        result.push(cur.trim().replace(/^"|"$/g, ''));
        return result;
    }

    function getBgClass(item) {
        const type = String(item.schoolType);
        if (type !== '1' && type !== '2') return ""; 

        const text = item.methodName.toLowerCase();
        if (text.includes('前期')) return "bg-zenki";
        if (text.includes('中期')) return "bg-chuki";
        if (text.includes('後期')) return "bg-koki";
        
        return "bg-dokuji";
    }

    function filterData() {
        if (allData.length === 0) return;

        const qType = document.getElementById("s-type").value;
        const qUniv = document.getElementById("s-univ").value.trim().toLowerCase();
        const qFac = document.getElementById("s-fac").value.trim().toLowerCase();
        const qDept = document.getElementById("s-dept").value.trim().toLowerCase();
        const qMethod = document.getElementById("s-method").value.trim().toLowerCase();

        const countBox = document.getElementById("match-count-box");
        const container = document.getElementById("result-container");

        if (!qType && !qUniv && !qFac && !qDept && !qMethod) {
            countBox.innerHTML = `<span>検索スタンバイ中</span><span class="highlight-count">全 ${allData.length.toLocaleString()} 件</span>`;
            container.innerHTML = `<div class="guide-msg">🔍 上の学校区分や検索窓から条件を指定してください</div>`;
            return;
        }

        const filtered = allData.filter(item => {
            if (qType && item.schoolType !== qType) return false;
            if (qUniv && !item.univ.toLowerCase().startsWith(qUniv)) return false;
            if (qFac && !item.fac.toLowerCase().startsWith(qFac)) return false;
            if (qDept && !item.dept.toLowerCase().startsWith(qDept)) return false;
            if (qMethod && !item.methodName.toLowerCase().includes(qMethod)) return false;
            return true;
        });

        if (qUniv) {
            filtered.sort((a, b) => {
                const aExact = a.univ.toLowerCase() === qUniv ? 0 : 1;
                const bExact = b.univ.toLowerCase() === qUniv ? 0 : 1;
                return aExact - bExact;
            });
        }

        renderGroupedResults(filtered, qUniv);
    }

    function renderGroupedResults(list, qUniv) {
        const container = document.getElementById("result-container");
        const countBox = document.getElementById("match-count-box");

        if (list.length === 0) {
            countBox.innerHTML = `<span>該当件数</span><span class="highlight-count error">0 件</span>`;
            container.innerHTML = `<div class="guide-msg error">条件に一致するデータが見つかりませんでした</div>`;
            return;
        }

        countBox.innerHTML = `<span>該当件数</span><span class="highlight-count">${list.length.toLocaleString()} 件</span>`;

        const univGrouped = {};
        list.forEach(item => {
            if (!univGrouped[item.univ]) {
                univGrouped[item.univ] = [];
            }
            univGrouped[item.univ].push(item);
        });

        const univNames = Object.keys(univGrouped);
        let html = '';

        univNames.forEach((univName, index) => {
            const univItems = univGrouped[univName];
            const isExactMatch = qUniv && univName.toLowerCase() === qUniv;
            let isOpen = false;
            if (qUniv) {
                if (isExactMatch) isOpen = true;
            } else {
                if (index === 0) isOpen = true;
            }

            const facGrouped = {};
            univItems.forEach(item => {
                if (!facGrouped[item.fac]) {
                    facGrouped[item.fac] = [];
                }
                facGrouped[item.fac].push(item);
            });

            let facHtml = '';
            Object.keys(facGrouped).forEach(facName => {
                const facItems = facGrouped[facName];

                // ★学科名でグループ分けしつつ、学科内の並び替えは行わずCSVの元の順番（インデックス順）をそのまま維持する
                facItems.sort((a, b) => {
                    if (a.dept !== b.dept) {
                        return a.dept.localeCompare(b.dept, 'ja');
                    }
                    return 0; // 同じ学科内は並び替えを行わず、元のCSVの順番を維持
                });

                let cardsHtml = '';
                facItems.forEach(item => {
                    const bgClass = getBgClass(item);
                    const deptStr = item.dept ? item.dept : '';
                    const badgeHtml = item.methodName ? `<div class="sub-card-meta"><span class="sub-card-badge">${item.methodName}</span></div>` : '';

                    cardsHtml += `
                        <div class="sub-card ${bgClass}">
                            <div class="sub-card-code-area">
                                <div class="sub-card-code">${item.code}</div>
                                <button onclick='addToList(${JSON.stringify(item)})'>保存</button>
                            </div>
                            <div class="sub-card-content">
                                ${deptStr ? `<div class="sub-card-main">${deptStr}</div>` : ''}
                                ${badgeHtml}
                            </div>
                        </div>
                    `;
                });

                facHtml += `
                    <div class="fac-section">
                        <div class="fac-title">${facName}</div>
                        <div class="fac-cards-wrapper">
                            ${cardsHtml}
                        </div>
                    </div>
                `;
            });

            html += `
                <div class="univ-group ${isOpen ? 'open' : ''}" id="univ-group-${index}">
                    <div class="univ-header" onclick="toggleUnivGroup(${index})">
                        <div class="univ-header-left">
                            <span>${univName}</span>
                            <span class="univ-count-badge">${univItems.length}件</span>
                        </div>
                        <div class="univ-arrow">▼</div>
                    </div>
                    <div class="univ-content">
                        ${facHtml}
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function toggleUnivGroup(index) {
        const targetGroup = document.getElementById(`univ-group-${index}`);
        const isOpen = targetGroup.classList.contains('open');

        document.querySelectorAll('.univ-group').forEach(group => {
            group.classList.remove('open');
        });

        if (!isOpen) {
            targetGroup.classList.add('open');
        }
    }

    function addToList(item) {
        if (savedList.some(i => i.code === item.code && i.univ === item.univ && i.methodName === item.methodName)) {
            showToast("この項目はすでにリストに登録されています", true);
            return;
        }
        if (savedList.length >= 10) {
            showToast("保存リストは最大10件までです", true);
            return;
        }
        savedList.push(item);
        showToast("リストに保存しました");
        renderSavedList();
    }

    function removeFromList(index) {
        savedList.splice(index, 1);
        showToast("リストから削除しました");
        renderSavedList();
    }

    function renderSavedList() {
        const container = document.getElementById("clip-container");
        document.getElementById("clip-count").innerText = `${savedList.length} / 10件`;

        if (savedList.length === 0) {
            container.innerHTML = `<div class="guide-msg small" id="clip-empty-msg">ここに保存した項目が並びます</div>`;
            return;
        }

        let cardsHtml = '';
        savedList.forEach((item, idx) => {
            const bgClass = getBgClass(item);
            const deptStr = item.dept ? ` / ${item.dept}` : '';
            const badgeHtml = item.methodName ? `<div class="sub-card-meta"><span class="sub-card-badge">${item.methodName}</span></div>` : '';

            cardsHtml += `
                <div class="sub-card ${bgClass}">
                    <div class="sub-card-code-area">
                        <div class="sub-card-code">${item.code}</div>
                        <button class="danger" onclick="removeFromList(${idx})">削除</button>
                    </div>
                    <div class="sub-card-content">
                        <div class="sub-card-main"><strong>${item.univ}</strong> ${item.fac}${deptStr}</div>
                        ${badgeHtml}
                    </div>
                </div>
            `;
        });

        container.innerHTML = cardsHtml;
    }
</script>

</body>
</html>
